server {
    listen 80;
    server_name odoo.ioebusiness.com.mx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name odoo.ioebusiness.com.mx;

    ssl_certificate /etc/letsencrypt/live/odoo.ioebusiness.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo.ioebusiness.com.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:odoo_ssl:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    location / {
        proxy_pass http://172.16.100.40:18069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
