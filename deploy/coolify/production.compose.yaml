# Production API + Flutter Web services only. SQL stays in its existing containers.
# Build candidate separately, then set IOE_IMAGE to its API/App-SHA tag.
services:
  erp-api:
    image: ${IOE_IMAGE:?Set IOE_IMAGE to a built candidate image}
    pull_policy: never
    entrypoint: ["node"]
    command: ["/srv/api/dist/main.js"]
    working_dir: /srv/api
    restart: unless-stopped
    env_file:
      - ./api.production.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      ADMS_PORT: "8081"
      DB_HOST: ioe-sql-standby
      DB_PORT: "1433"
      DB_NAME: IOELOCAL
    volumes:
      - type: bind
        source: /srv/ioe/erp/uploads
        target: /srv/api/uploads
        bind:
          create_host_path: false
      - type: bind
        source: /ArchivosUsuarios/respaldoCFDI
        target: /ArchivosUsuarios/respaldoCFDI
        bind:
          create_host_path: false
    networks:
      app: {}
      ioe_ha: {}
    labels:
      coolify.managed: "true"
      coolify.name: erp-api-tysuzjl0xcdbhfje49pbcqyg
      coolify.serviceUuid: tysuzjl0xcdbhfje49pbcqyg
      coolify.type: service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  standby-front:
    image: ${IOE_IMAGE:?Set IOE_IMAGE to a built candidate image}
    pull_policy: never
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      erp-api:
        condition: service_healthy
    ports:
      - target: 8085
        published: "18085"
        host_ip: 172.16.100.40
        protocol: tcp
    networks:
      app: {}
    labels:
      coolify.managed: "true"
      coolify.name: standby-front-tysuzjl0xcdbhfje49pbcqyg
      coolify.serviceUuid: tysuzjl0xcdbhfje49pbcqyg
      coolify.type: service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app:
    external: true
    name: ${COOLIFY_APP_NETWORK:-tysuzjl0xcdbhfje49pbcqyg}
  ioe_ha:
    external: true
    name: ioe_ha
