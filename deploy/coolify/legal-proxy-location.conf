# Include inside the HTTPS server for erp.ioebusiness.com.mx.
# Coolify serves public HTML; existing ERP/API upstream remains unchanged.
location ^~ /legal/ {
    proxy_pass http://172.16.100.40:18085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
