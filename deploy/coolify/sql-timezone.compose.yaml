# Solo ventana de mantenimiento. Preparar entorno privado desde contenedor vivo.
# Crear detenido; conectar ioe_ha con alias antes de arrancar. Ver README horario.
services:
  sqlserver:
    image: sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    pull_policy: never
    container_name: sqlserver-cu25-alignment
    hostname: dd7842d7ba7e
    user: mssql
    entrypoint: ["/opt/mssql/bin/launch_sqlservr.sh"]
    command: ["/opt/mssql/bin/sqlservr"]
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - path: ${SQL_PRIVATE_ENV:?Set private environment path outside Git}
        format: raw
    environment:
      TZ: America/Mexico_City
    network_mode: bridge
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    shm_size: 64m
    logging:
      driver: json-file

volumes:
  sql_data:
    external: true
    name: sqlserver_cu25_alignment_data
