# Coolify Docker Compose Empty service for a private standby front preview.
# The local watcher rebuilds this tag after changes to either GitHub master.
services:
  standby-front:
    image: ioe-allinone:standby-auto
    pull_policy: never
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
