worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 8085;
    root /srv/www/web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # API remains intentionally stopped on standby.
    location /api/ { return 503; }
  }
}
